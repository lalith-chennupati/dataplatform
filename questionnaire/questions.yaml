      - {q: "What is the multi-vendor / exit strategy for hardware, software and model providers?", t: text, own: PROC, p: P2, std: "Vendor diversification and exit plan"}
      - {q: "Which architecture review board approves new patterns and deviations, and with what SLA?", t: text, own: EA, p: P1, std: "Architecture review and exception process"}
      - {q: "How will standards be published, versioned and enforced (wiki, policy-as-code, CI checks, admission controllers)?", t: text, own: EA, p: P2, std: "Standards publication and enforcement mechanism"}
      - {q: "Which documentation artefacts are mandatory per AI solution (HLD, LLD, threat model, runbook, model card)?", t: multi, o: [High-level design, Low-level design, Threat model, Data flow diagram, Runbook, Model card, AI impact assessment, DR plan], own: EA, p: P2, std: "Mandatory solution documentation"}

# Dell AI Factory / AI Data Platform building blocks referenced by the questions.
# Names reflect Dell's public portfolio as understood at authoring time - verify against
# https://www.dell.com/en-us/shop/artificial-intelligence/sc/ai-data-platform and your Dell account team.
components:
  - {layer: Storage engine, component: Dell PowerScale, role: "Scale-out file storage (OneFS) for unstructured AI data; NFS / SMB / S3 / HDFS; NFS over RDMA and GPUDirect Storage for GPU data paths", domains: [STO, BCR]}
  - {layer: Storage engine, component: Dell ObjectScale, role: "S3-compatible object storage for data lakes, model artefacts and checkpoints", domains: [STO, LAK]}
  - {layer: Data engine, component: Dell Data Lakehouse / Data Analytics Engine, role: "Federated SQL analytics and lakehouse (Trino / Starburst based, Apache Iceberg)", domains: [LAK, ING]}
  - {layer: Data engine, component: Spark-based Data Processing Engine, role: "Distributed data preparation and transformation for AI pipelines", domains: [LAK, ING]}
  - {layer: Data engine, component: Data Search Engine / vector search, role: "Hybrid keyword + semantic search and vector indexing for RAG and agents", domains: [RAG]}
  - {layer: Compute, component: Dell PowerEdge XE / R-series GPU servers, role: "Accelerated compute for training, fine-tuning and inference (NVIDIA, AMD, Intel accelerators)", domains: [CMP, FAC]}
  - {layer: Network, component: Dell PowerSwitch / NVIDIA Spectrum-X / InfiniBand, role: "Back-end GPU fabric, storage and front-end networks", domains: [NET]}
  - {layer: AI software, component: NVIDIA AI Enterprise (NIM, NeMo, Triton), role: "Model serving, customisation and guardrails stack in Dell AI Factory with NVIDIA", domains: [PLT, MLO, AGT]}
  - {layer: AI software, component: Dell Enterprise Hub on Hugging Face, role: "Curated open models optimised for Dell infrastructure", domains: [MLO]}
  - {layer: Platform, component: Red Hat OpenShift AI / Kubernetes / Dell Container Storage Modules, role: "Container platform and persistent storage integration for AI workloads", domains: [PLT, STO]}
  - {layer: Automation, component: Dell Omnia / OpenManage Enterprise / iDRAC, role: "Bare-metal provisioning, cluster deployment and lifecycle management", domains: [PLT, OPS]}
  - {layer: Operations, component: APEX AIOps (CloudIQ) / InsightIQ, role: "Infrastructure health, capacity and performance analytics", domains: [OPS, FIN]}
  - {layer: Protection, component: PowerProtect Data Manager / Cyber Recovery, role: "Backup and isolated cyber-recovery vault for AI data and models", domains: [BCR]}
  - {layer: Facilities, component: Dell Integrated Rack Scalable Systems / liquid cooling, role: "Pre-integrated, high-density racks with direct liquid cooling options", domains: [FAC]}
  - {layer: Services, component: Dell Professional Services / ProSupport / APEX, role: "Design, deployment, managed services and as-a-service consumption", domains: [ORG, OPS, FIN]}
