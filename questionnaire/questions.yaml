  - code: ARC
    name: Architecture Standards, Interoperability & Vendor Strategy
    standard: STD-20 Reference Architecture, Naming & Exception Standard
    intent: Lock in reference architectures, naming conventions, interoperability and the exception process that all other standards depend on.
    questions:
      - {q: "Which Dell AI Factory reference architecture / validated design will be the baseline (e.g. Dell AI Factory with NVIDIA, with AMD, with Intel)?", t: choice, o: [Dell AI Factory with NVIDIA, Dell AI Factory with AMD, Dell AI Factory with Intel, Multi-vendor, Undecided], own: EA, p: P1, std: "Baseline reference architecture"}
