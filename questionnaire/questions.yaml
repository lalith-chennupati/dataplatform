      - {q: "Which cost units will be metered (GPU-hours, storage TB-month, tokens, API calls, network)?", t: multi, o: [GPU-hours, CPU-hours, Storage TB-month, Tokens / requests, Data egress, Licences, Support / services], own: FIN, p: P2, std: "Metering units and rate card"}
      - {q: "Which mandatory tags / labels are required on every workload and dataset (cost center, owner, project, environment, data class)?", t: text, own: FIN, p: P1, std: "Mandatory tagging / labelling standard"}
      - {q: "Is a consumption-based procurement model preferred (e.g. Dell APEX / as-a-service) over capex?", t: choice, o: [Capex purchase, Opex / as-a-service, Lease, Mixed, Undecided], own: PROC, p: P1, std: "Procurement model"}
      - {q: "What is the capacity planning horizon and trigger for expansion (utilisation %, queue wait time)?", t: text, own: INFRA, p: P2, std: "Capacity triggers"}
      - {q: "How will on-prem cost-per-unit be benchmarked against public cloud alternatives?", t: text, own: FIN, p: P3, std: "TCO benchmarking"}
      - {q: "Are budgets and alerts required per team / project?", t: yn, own: FIN, p: P2, std: "Budgets and spend alerts"}

