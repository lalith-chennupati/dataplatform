  - code: BCR
    name: Resilience, Backup & Cyber Recovery
    standard: STD-16 Resilience, Backup & Cyber Recovery Standard
    intent: Define what must be protected (data, models, checkpoints, configs) and how fast it must recover.
    questions:
      - {q: "Which AI assets are business-critical and must be backed up (training data, curated tables, model weights, checkpoints, vector indexes, configs)?", t: multi, o: [Raw / source data, Curated lakehouse tables, Model weights, Training checkpoints, Vector indexes, Prompts and logs, Platform configuration / IaC], own: INFRA, p: P1, std: "Protection scope"}
      - {q: "What RPO / RTO apply to each critical AI service?", t: text, own: OPS, p: P1, std: "RPO / RTO tiers"}
      - {q: "Is a secondary site / DR AI Factory required, or is degraded service acceptable during disaster?", t: choice, o: [Active-active, Active-passive DR site, Cloud DR, Backup-only restore, No DR required], own: EA, p: P1, std: "DR topology"}
      - {q: "Is an isolated cyber-recovery vault (air-gapped, immutable copies) required?", t: yn, own: SEC, p: P2, std: "Cyber recovery vault (e.g. PowerProtect Cyber Recovery)"}
      - {q: "Which backup software is standard (e.g. PowerProtect Data Manager, Veeam, Commvault)?", t: text, own: INFRA, p: P2, std: "Backup tooling"}
      - {q: "How often must restores and DR failovers be tested?", t: text, own: OPS, p: P2, std: "Recovery testing cadence"}
      - {q: "What checkpointing frequency is required for long training jobs to tolerate node / GPU failure?", t: text, own: DS, p: P2, std: "Checkpoint policy"}

  - code: FIN
