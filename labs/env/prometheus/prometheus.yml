global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: trino
    metrics_path: /metrics
    static_configs: [{targets: ["trino:8080"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: infra-sim            # C08: stand-in for iDRAC telemetry, DCGM exporter, OneFS and switch exporters
    scrape_interval: 5s
    static_configs: [{targets: ["telemetry:9101"]}]
