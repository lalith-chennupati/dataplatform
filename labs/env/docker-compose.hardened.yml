# Lab E01: hardening overlay. Binds every published port to loopback and removes anonymous Grafana admin.
#   docker compose -f docker-compose.yml -f docker-compose.hardened.yml --profile core --profile obs --profile ai up -d
# It does not add TLS or authentication to Trino/Elasticsearch/MLflow: see the E01 guide for those steps.
services:
  s3:            {ports: !override ["127.0.0.1:8333:8333"]}
  postgres:      {ports: !override ["127.0.0.1:5432:5432"]}
  iceberg-rest:  {ports: !override ["127.0.0.1:8181:8181"]}
  trino:         {ports: !override ["127.0.0.1:8080:8080"]}
  elasticsearch: {ports: !override ["127.0.0.1:9200:9200"]}
  redfish:       {ports: !override ["127.0.0.1:8000:8000"]}
  ollama:        {ports: !override ["127.0.0.1:11434:11434"]}
  mlflow:        {ports: !override ["127.0.0.1:5000:5000"]}
  prometheus:    {ports: !override ["127.0.0.1:9090:9090"]}
  grafana:
    ports: !override ["127.0.0.1:3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-now}
