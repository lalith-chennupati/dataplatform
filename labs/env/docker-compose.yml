# SIM-tier stand-ins for the Dell AI Data Platform engines. See labs/guides/00-foundations/L01-lab-environment.md
#   s3             -> stands in for ObjectScale (S3 API)               profile: core
#   iceberg-rest   -> Iceberg REST catalog                              profile: core
#   trino          -> stands in for the Data Analytics Engine           profile: core
#   postgres       -> sample "operational" source system                profile: core
#   elasticsearch  -> stands in for the Data Search Engine              profile: core
#   spark          -> stands in for the Data Processing Engine          profile: spark
#   redfish        -> DMTF Redfish mockup (iDRAC API shape)             profile: infra
#   ollama         -> CPU LLM + embeddings (stands in for NIM)          profile: ai
#   mlflow         -> model registry / tracking                         profile: ai
#   prometheus, grafana -> observability                                profile: obs
name: aifactory-lab

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
  AWS_REGION: ${S3_REGION}
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

services:
  s3:
    image: ${REGISTRY}/chrislusf/seaweedfs:3.97
    profiles: [core]
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256
    ports: ["8333:8333"]
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 5s
      retries: 30

  s3-init:
    image: ${REGISTRY}/amazon/aws-cli:2.27.0
    profiles: [core]
    depends_on: {s3: {condition: service_healthy}}
    environment: *s3-env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for b in warehouse bu-finance bu-research model-registry checkpoints documents; do
          aws --endpoint-url http://s3:8333 s3api head-bucket --bucket $$b 2>/dev/null || aws --endpoint-url http://s3:8333 s3 mb s3://$$b
        done

  postgres:
    image: ${REGISTRY}/library/postgres:16
    profiles: [core]
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: lab
    ports: ["5432:5432"]
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 30

  iceberg-rest:
    image: ${REGISTRY}/apache/iceberg-rest-fixture:1.9.2
    profiles: [core]
    depends_on: {s3-init: {condition: service_completed_successfully}}
    environment:
      <<: *s3-env
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://s3:8333
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_URI: jdbc:sqlite:file:/catalog/iceberg.db
      CATALOG_JDBC_USER: user
      CATALOG_JDBC_PASSWORD: password
    user: root
    volumes: [catalog-data:/catalog]
    ports: ["8181:8181"]

  trino:
    image: ${REGISTRY}/trinodb/trino:476
    profiles: [core]
    depends_on:
      iceberg-rest: {condition: service_started}
      postgres: {condition: service_healthy}
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION}
      PG_PASSWORD: ${PG_PASSWORD}
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    ports: ["8080:8080"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    profiles: [core]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports: ["9200:9200"]
    volumes: [es-data:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -s localhost:9200/_cluster/health | grep -qv red"]
      interval: 10s
      retries: 30

  spark:
    image: ${REGISTRY}/apache/spark:3.5.6
    profiles: [spark]
    user: root
    environment: *s3-env
    entrypoint: ["sleep", "infinity"]
    volumes:
      - ./spark:/opt/lab
      - ivy-cache:/root/.ivy2

  redfish:
    image: docker.io/dmtf/redfish-mockup-server:1.2.6
    profiles: [infra]
    ports: ["8000:8000"]

  ollama:
    image: ${REGISTRY}/ollama/ollama:latest
    profiles: [ai]
    ports: ["11434:11434"]
    volumes: [ollama-data:/root/.ollama]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    profiles: [ai]
    environment:
      <<: *s3-env
      MLFLOW_S3_ENDPOINT_URL: http://s3:8333
    command: >
      sh -c "pip install -q boto3 && mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db --artifacts-destination s3://model-registry/mlflow"
    ports: ["5000:5000"]
    volumes: [mlflow-data:/mlflow]

  prometheus:
    image: ${REGISTRY}/prom/prometheus:latest
    profiles: [obs]
    volumes: [./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

  grafana:
    image: ${REGISTRY}/grafana/grafana:latest
    profiles: [obs]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports: ["3000:3000"]

volumes:
  s3-data:
  pg-data:
  catalog-data:
  es-data:
  ivy-cache:
  ollama-data:
  mlflow-data:
